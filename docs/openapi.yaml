openapi: 3.1.0
info:
  title: CommerceOps API
  version: 0.3.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check application and required dependency health
      responses:
        "200":
          description: Application and PostgreSQL are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Start a verified company-scoped session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, company_id]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                company_id: {type: string, format: uuid}
      responses:
        "200": {description: Authenticated; the session cookie is set}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/auth/session:
    get:
      operationId: getSession
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Current authenticated principal}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/company:
    get:
      operationId: getCompany
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Company established by the session}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/employees:
    get:
      operationId: listEmployees
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant employee list}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createEmployee
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEmployee"}
      responses:
        "201": {description: Employee created}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/employees/{employee_id}:
    parameters:
      - {$ref: "#/components/parameters/EmployeeID"}
    patch:
      operationId: setEmployeeStatus
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Employee status changed}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/user-access:
    post:
      operationId: createUserAccess
      security: [{sessionCookie: []}]
      responses:
        "201": {description: User and company access created}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/user-access/{user_id}:
    parameters:
      - {$ref: "#/components/parameters/UserID"}
    patch:
      operationId: setUserAccessStatus
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Company access status changed}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/user-access/{user_id}/roles:
    parameters:
      - {$ref: "#/components/parameters/UserID"}
    put:
      operationId: setUserRoles
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Role assignments replaced}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/roles:
    get:
      operationId: listRoles
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant roles and permissions}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createRole
      security: [{sessionCookie: []}]
      responses:
        "201": {description: Role created}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/roles/{role_id}/permissions:
    parameters:
      - {$ref: "#/components/parameters/RoleID"}
    put:
      operationId: setRolePermissions
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Permission assignments replaced}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/permissions:
    get:
      operationId: listPermissions
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Permission definitions}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/module-entitlements:
    get:
      operationId: listModuleEntitlements
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant module entitlements}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/module-entitlements/{module_key}:
    parameters:
      - name: module_key
        in: path
        required: true
        schema: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
    put:
      operationId: setModuleEntitlement
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Entitlement changed}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Recent tenant audit entries}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/marketplaces:
    get:
      operationId: listMarketplaces
      summary: List normalized marketplace reference keys
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Active marketplace references}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Search tenant products
      security: [{sessionCookie: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive]}}
      responses:
        "200": {description: Tenant-scoped product list}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createProduct
      summary: Create a canonical tenant product
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "201": {description: Product created}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/products/{product_id}:
    parameters:
      - {$ref: "#/components/parameters/ProductID"}
    get:
      operationId: getProduct
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant product}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateProduct
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "200": {description: Updated product}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/sku-mappings:
    get:
      operationId: listSkuMappings
      security: [{sessionCookie: []}]
      parameters:
        - {name: product_id, in: query, schema: {type: string, format: uuid}}
        - {name: marketplace, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive]}}
      responses:
        "200": {description: Tenant-scoped SKU mappings}
    post:
      operationId: createSkuMapping
      summary: Manually train an exact SKU mapping
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkuMappingInput"}
      responses:
        "201": {description: SKU mapping created}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/sku-mappings/{mapping_id}:
    parameters:
      - {$ref: "#/components/parameters/MappingID"}
    patch:
      operationId: updateSkuMapping
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkuMappingInput"}
      responses:
        "200": {description: Updated SKU mapping}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/sku-mappings/resolve:
    post:
      operationId: resolveSkuMapping
      summary: Resolve a deterministic exact marketplace SKU
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [marketplace_key, sku]
              properties:
                marketplace_key: {type: string}
                sku: {type: string}
      responses:
        "200":
          description: Resolved mapping/product or explicit unresolved result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkuResolution"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: commerceops_session
  parameters:
    EmployeeID: {name: employee_id, in: path, required: true, schema: {type: string, format: uuid}}
    UserID: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    RoleID: {name: role_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProductID: {name: product_id, in: path, required: true, schema: {type: string, format: uuid}}
    MappingID: {name: mapping_id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
    CreateEmployee:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: {type: string}
        user_id: {type: [string, "null"], format: uuid}
    ProductInput:
      type: object
      additionalProperties: false
      required: [internal_code, name]
      properties:
        internal_code: {type: string}
        name: {type: string}
        brand: {type: [string, "null"]}
        variant: {type: [string, "null"]}
        size: {type: [string, "null"]}
        pack_type: {type: [string, "null"]}
        unit_count: {type: [integer, "null"], minimum: 1}
        status: {type: string, enum: [active, inactive], default: active}
    SkuMappingInput:
      type: object
      additionalProperties: false
      required: [marketplace_key, product_id, sku]
      properties:
        marketplace_key: {type: string}
        product_id: {type: string, format: uuid}
        sku: {type: string}
        quantity_multiplier: {type: integer, minimum: 1, default: 1}
        interpretation_metadata: {type: object, default: {}}
        status: {type: string, enum: [active, inactive], default: active}
    SkuResolution:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [resolved, unresolved]}
        product: {type: object}
        mapping: {type: object}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
