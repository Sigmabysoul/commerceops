          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AutomationExecution:
      type: object
      required:
      - id
      - rule_id
      - rule_version
      - occurrence_key
      - event_id
      - scheduled_at
      - test_run
      - snapshot
      - status
      - attempt_count
      - available_at
      - error
      - printer_job_id
      - job_status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        rule_id:
          type: string
          format: uuid
        rule_version:
          type: integer
        occurrence_key:
          type: string
        event_id:
          type:
          - string
          - 'null'
          format: uuid
        scheduled_at:
          type:
          - string
          - 'null'
          format: date-time
        test_run:
          type: boolean
        snapshot:
          $ref: '#/components/schemas/AutomationRule'
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - skipped
        attempt_count:
          type: integer
        available_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        printer_job_id:
          type:
          - string
          - 'null'
          format: uuid
        job_status:
          type:
          - string
          - 'null'
          enum:
          - queued
          - claimed
          - printing
          - completed
          - failed
          - cancelled
          - null
        created_at:
          type: string
          format: date-time
