        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: commerceops_session
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-credential
  parameters:
    EmployeeID: {name: employee_id, in: path, required: true, schema: {type: string, format: uuid}}
    UserID: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    RoleID: {name: role_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProductID: {name: product_id, in: path, required: true, schema: {type: string, format: uuid}}
    MappingID: {name: mapping_id, in: path, required: true, schema: {type: string, format: uuid}}
    BatchID: {name: batch_id, in: path, required: true, schema: {type: string, format: uuid}}
    PrintJobID: {name: print_job_id, in: path, required: true, schema: {type: string, format: uuid}}
    ArtifactID: {name: artifact_id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    QuickPrint:
      type: object
      additionalProperties: false
      required: [asset_id, printer_id, copies, large_quantity_confirmed, idempotency_key]
      properties:
        asset_id: {type: string, format: uuid}
        printer_id: {type: string, format: uuid}
        copies: {type: integer, minimum: 1, maximum: 100}
        large_quantity_confirmed: {type: boolean, description: Must be true above 20 copies}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    QueueArtifactPrint:
      type: object
      additionalProperties: false
      required: [printer_id, copies, idempotency_key]
      properties:
        printer_id: {type: string, format: uuid}
        copies: {type: integer, minimum: 1, maximum: 100}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
    CreateEmployee:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: {type: string}
        user_id: {type: [string, "null"], format: uuid}
    ProductInput:
      type: object
      additionalProperties: false
      required: [internal_code, name]
      properties:
        internal_code: {type: string}
        name: {type: string}
        brand: {type: [string, "null"]}
        variant: {type: [string, "null"]}
        size: {type: [string, "null"]}
        pack_type: {type: [string, "null"]}
        unit_count: {type: [integer, "null"], minimum: 1}
        status: {type: string, enum: [active, inactive], default: active}
    SkuMappingInput:
      type: object
      additionalProperties: false
      required: [marketplace_key, product_id, sku]
      properties:
        marketplace_key: {type: string}
        product_id: {type: string, format: uuid}
        sku: {type: string}
        quantity_multiplier: {type: integer, minimum: 1, default: 1}
        interpretation_metadata: {type: object, default: {}}
        status: {type: string, enum: [active, inactive], default: active}
    SkuResolution:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [resolved, unresolved]}
        product: {type: object}
        mapping: {type: object}
    CreateBatch:
      type: object
      additionalProperties: false
      required: [marketplace_key, order_ids, idempotency_key]
      properties:
        marketplace_key: {type: string, enum: [flipkart, amazon, meesho, myntra, snapdeal]}
        order_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    GeneratePrintJob:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        sort_labels: {type: boolean, default: false}
        export_invoices: {type: boolean, default: false}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReplaceWorkerAssignmentRules:
      type: object
      additionalProperties: false
      required: [marketplace_key, rules]
      properties:
        marketplace_key: {type: string, enum: [flipkart, amazon, meesho, myntra, snapdeal]}
        rules:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [employee_id, priority]
            properties:
              product_id: {type: [string, "null"], format: uuid}
              employee_id: {type: string, format: uuid}
              priority: {type: integer, minimum: 0, maximum: 10000}
    ReprintJob:
      type: object
      additionalProperties: false
      required: [reason, idempotency_key]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    InventoryCommand:
      type: object
      additionalProperties: false
      required: [product_id, quantity, reason, idempotency_key]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, format: int64}
        reason: {type: string, minLength: 1, maxLength: 500}
        reference_type: {type: [string, "null"]}
        reference_id: {type: [string, "null"]}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    IdempotentCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReasonedIdempotentCommand:
      type: object
      additionalProperties: false
      required: [reason, idempotency_key]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReservationCommand:
      type: object
      additionalProperties: false
      required: [product_id, quantity, reason, source_type, source_id, idempotency_key]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500}
        source_type: {type: string, minLength: 1, maxLength: 100}
        source_id: {type: string, minLength: 1, maxLength: 200}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    CreateCancellation:
      type: object
      additionalProperties: false
      required: [marketplace_order_id, reason, cancelled_at, idempotency_key]
      properties:
        marketplace_order_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 500}
        cancelled_at: {type: string, format: date-time}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    CreateReturn:
      type: object
      additionalProperties: false
      required: [marketplace_order_id, reason, items, idempotency_key]
      properties:
        marketplace_order_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 500}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [marketplace_order_item_id, expected_quantity]
            properties:
              marketplace_order_item_id: {type: string, format: uuid}
              expected_quantity: {type: integer, format: int64, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReceiveReturn:
      type: object
      additionalProperties: false
      required: [items, idempotency_key]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [return_item_id, received_quantity]
            properties:
              return_item_id: {type: string, format: uuid}
              received_quantity: {type: integer, format: int64, minimum: 0}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    InspectReturn:
      type: object
      additionalProperties: false
      required: [items, idempotency_key]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [return_item_id, disposition]
            properties:
              return_item_id: {type: string, format: uuid}
              disposition: {type: string, enum: [restockable, damaged, wrong_product, missing, rejected]}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    RestockReturn:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    CorrectReturnRestock:
      type: object
      additionalProperties: false
      required: [items, reason, idempotency_key]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [return_item_id, quantity]
            properties:
              return_item_id: {type: string, format: uuid}
              quantity: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    CloseLifecycle:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ConsignmentDepartmentCommand:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        status: {type: string, enum: [active, inactive], default: active}
    ConsignmentMembershipCommand:
      type: object
      additionalProperties: false
      required: [employee_ids]
      properties:
        employee_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
    CreateConsignment:
      type: object
      additionalProperties: false
      required: [order_reference, source_type, lines, idempotency_key]
      properties:
        order_reference: {type: string, minLength: 1, maxLength: 200}
        dealer_reference: {type: [string, "null"], minLength: 1, maxLength: 200}
        pouch_reference: {type: [string, "null"], minLength: 1, maxLength: 200}
        source_type: {type: string, enum: [manual, import]}
        source_reference: {type: [string, "null"], minLength: 1, maxLength: 500}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [product_id, department_id, required_quantity]
            properties:
              product_id: {type: string, format: uuid}
              department_id: {type: string, format: uuid}
              required_quantity: {type: integer, format: int64, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ConsignmentAction:
      type: object
      additionalProperties: false
      required: [expected_version, idempotency_key]
      properties:
        expected_version: {type: integer, minimum: 1}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ConsignmentTransition:
      type: object
      additionalProperties: false
      required: [target_status, expected_version, idempotency_key]
      properties:
        target_status: {type: string, enum: [picking, ready, packing, packed, completed]}
        expected_version: {type: integer, minimum: 1}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ConsignmentProgress:
      type: object
      additionalProperties: false
      required: [ready_quantity, packed_quantity, expected_version, idempotency_key]
      properties:
        ready_quantity: {type: integer, format: int64, minimum: 0}
        packed_quantity: {type: integer, format: int64, minimum: 0}
        expected_version: {type: integer, minimum: 1}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}

    AutomationSchedule:
      type: object
      required: []
      properties:
        mode:
          type: string
          enum:
          - daily
          - weekdays
          - selected_weekdays
        times:
          type: array
          items:
            type: string
            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          minItems: 1
          maxItems: 24
          uniqueItems: true
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
          uniqueItems: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      additionalProperties: false
      description: Scheduled rules require mode and times; selected_weekdays also requires
        weekdays. Event rules use an empty object. Dates are inclusive. Nonexistent DST
        minutes are skipped; repeated minutes run once.
    AutomationRuleInput:
      type: object
      required:
      - name
      - enabled
      - paused
      - trigger_type
      - schedule
      - asset_id
      - printer_id
      - copies
      - daily_limit
      - failure_threshold
      - backoff_seconds
      - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean
        paused:
          type: boolean
        trigger_type:
          type: string
          enum:
          - scheduled
          - ecommerce_batch_ready
          - consignment_packing
          - consignment_packed
        schedule:
          $ref: '#/components/schemas/AutomationSchedule'
        asset_id:
          type: string
          format: uuid
        printer_id:
          type: string
          format: uuid
        copies:
          type: integer
          minimum: 1
          maximum: 100
        daily_limit:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
        failure_threshold:
          type: integer
          minimum: 1
          maximum: 20
        backoff_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        version:
          type: integer
          minimum: 0
          description: Zero on create; current optimistic version on update.
      additionalProperties: false
    AutomationRule:
      type: object
      required:
      - name
      - enabled
      - paused
      - trigger_type
      - schedule
      - asset_id
      - printer_id
      - copies
      - daily_limit
      - failure_threshold
      - backoff_seconds
      - version
      - id
      - timezone
      - created_by
      - asset_name
      - printer_name
      - consecutive_failures
      - backoff_until
      - next_run_at
      - created_at
      - updated_at
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
