      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RestockReturn"}}}}
      responses:
        "201": {description: Return restock ledger transactions recorded}
        "200": {description: Existing restock returned for exact replay}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/returns/{return_id}/restock-corrections:
    parameters:
      - {name: return_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: correctReturnRestock
      summary: Record a bounded compensating inventory correction for an earlier restock
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CorrectReturnRestock"}}}}
      responses:
        "201": {description: Compensating correction recorded without rewriting history}
        "200": {description: Existing correction returned for exact replay}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/returns/{return_id}/close:
    parameters:
      - {name: return_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: closeReturn
      summary: Idempotently close a disposition-complete return without changing inventory
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CloseLifecycle"}}}}
      responses:
        "201": {description: Terminal return closure recorded}
        "200": {description: Existing closure returned for exact replay}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/consignment-departments:
    get:
      operationId: listConsignmentDepartments
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Broad or employee-membership-scoped departments}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createConsignmentDepartment
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsignmentDepartmentCommand"}}}}
      responses:
        "201": {description: Configurable tenant department created}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/consignment-departments/{department_id}/members:
    parameters:
      - {name: department_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: replaceConsignmentDepartmentMembers
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsignmentMembershipCommand"}}}}
      responses:
        "200": {description: Active employee membership replaced}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/consignment-departments/{department_id}:
    parameters:
      - {name: department_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateConsignmentDepartment
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsignmentDepartmentCommand"}}}}
      responses:
        "200": {description: Department name or lifecycle status updated}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/consignments:
    get:
      operationId: listConsignments
      security: [{sessionCookie: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [created, allocated, picking, ready, packing, packed, outbound, completed, cancelled]}}
        - {name: department_id, in: query, schema: {type: string, format: uuid}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
      responses:
        "200": {description: Broad or department-scoped consignment board}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createConsignment
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateConsignment"}}}}
      responses:
        "201": {description: Consignment and immutable creation event created}
        "200": {description: Existing consignment returned for exact replay}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/consignments/{consignment_id}:
    parameters:
      - {name: consignment_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getConsignment
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Authorized consignment detail, lines, and history}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/consignments/{consignment_id}/allocate:
    parameters:
      - {name: consignment_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: allocateConsignment
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsignmentAction"}}}}
      responses:
        "201": {description: Requirements reserved and state allocated atomically}
        "200": {description: Exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/consignments/{consignment_id}/transition:
    parameters:
      - {name: consignment_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: transitionConsignment
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsignmentTransition"}}}}
      responses:
        "201": {description: Valid state transition recorded}
        "200": {description: Exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/consignments/{consignment_id}/lines/{line_id}/progress:
    parameters:
      - {name: consignment_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: line_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: updateConsignmentLineProgress
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsignmentProgress"}}}}
      responses:
        "201": {description: Explicit ready and packed quantities recorded}
        "200": {description: Exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/consignments/{consignment_id}/confirm-outbound:
    parameters:
      - {name: consignment_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: confirmConsignmentOutbound
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsignmentAction"}}}}
      responses:
        "201": {description: Reservation consumed and consignment_out ledger recorded atomically}
        "200": {description: Exact replay without another deduction}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/consignments/{consignment_id}/cancel:
    parameters:
      - {name: consignment_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: cancelConsignment
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsignmentAction"}}}}
      responses:
        "201": {description: Pre-outbound consignment cancelled and reservations released}
        "200": {description: Exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/reports/dashboard:
    get:
      operationId: getOperationalDashboard
      summary: Read tenant-scoped operational metrics from authoritative domains
      security: [{sessionCookie: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}, description: Inclusive range start with explicit offset}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}, description: Exclusive range end with explicit offset}
        - {name: marketplace, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,49}$'}}
        - {name: product_id, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200": {description: Operational summary, marketplace breakdown, and permission-gated inventory and return/cancellation data}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: commerceops_session
  parameters:
    EmployeeID: {name: employee_id, in: path, required: true, schema: {type: string, format: uuid}}
    UserID: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    RoleID: {name: role_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProductID: {name: product_id, in: path, required: true, schema: {type: string, format: uuid}}
    MappingID: {name: mapping_id, in: path, required: true, schema: {type: string, format: uuid}}
    BatchID: {name: batch_id, in: path, required: true, schema: {type: string, format: uuid}}
    PrintJobID: {name: print_job_id, in: path, required: true, schema: {type: string, format: uuid}}
    ArtifactID: {name: artifact_id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
    CreateEmployee:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: {type: string}
        user_id: {type: [string, "null"], format: uuid}
    ProductInput:
      type: object
      additionalProperties: false
      required: [internal_code, name]
      properties:
        internal_code: {type: string}
        name: {type: string}
        brand: {type: [string, "null"]}
        variant: {type: [string, "null"]}
        size: {type: [string, "null"]}
        pack_type: {type: [string, "null"]}
        unit_count: {type: [integer, "null"], minimum: 1}
        status: {type: string, enum: [active, inactive], default: active}
    SkuMappingInput:
      type: object
      additionalProperties: false
      required: [marketplace_key, product_id, sku]
      properties:
        marketplace_key: {type: string}
        product_id: {type: string, format: uuid}
        sku: {type: string}
        quantity_multiplier: {type: integer, minimum: 1, default: 1}
        interpretation_metadata: {type: object, default: {}}
        status: {type: string, enum: [active, inactive], default: active}
    SkuResolution:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [resolved, unresolved]}
        product: {type: object}
        mapping: {type: object}
    CreateBatch:
      type: object
      additionalProperties: false
      required: [marketplace_key, order_ids, idempotency_key]
      properties:
        marketplace_key: {type: string, enum: [flipkart, amazon]}
        order_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    GeneratePrintJob:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        sort_labels: {type: boolean, default: false}
        export_invoices: {type: boolean, default: false}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReplaceWorkerAssignmentRules:
      type: object
      additionalProperties: false
      required: [marketplace_key, rules]
      properties:
        marketplace_key: {type: string, enum: [flipkart, amazon]}
        rules:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [employee_id, priority]
            properties:
              product_id: {type: [string, "null"], format: uuid}
              employee_id: {type: string, format: uuid}
              priority: {type: integer, minimum: 0, maximum: 10000}
    ReprintJob:
      type: object
      additionalProperties: false
      required: [reason, idempotency_key]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    InventoryCommand:
      type: object
      additionalProperties: false
      required: [product_id, quantity, reason, idempotency_key]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, format: int64}
        reason: {type: string, minLength: 1, maxLength: 500}
        reference_type: {type: [string, "null"]}
        reference_id: {type: [string, "null"]}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    IdempotentCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReasonedIdempotentCommand:
      type: object
      additionalProperties: false
      required: [reason, idempotency_key]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReservationCommand:
      type: object
      additionalProperties: false
      required: [product_id, quantity, reason, source_type, source_id, idempotency_key]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500}
        source_type: {type: string, minLength: 1, maxLength: 100}
        source_id: {type: string, minLength: 1, maxLength: 200}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    CreateCancellation:
      type: object
      additionalProperties: false
      required: [marketplace_order_id, reason, cancelled_at, idempotency_key]
      properties:
        marketplace_order_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 500}
        cancelled_at: {type: string, format: date-time}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    CreateReturn:
      type: object
      additionalProperties: false
      required: [marketplace_order_id, reason, items, idempotency_key]
      properties:
        marketplace_order_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 500}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [marketplace_order_item_id, expected_quantity]
            properties:
              marketplace_order_item_id: {type: string, format: uuid}
              expected_quantity: {type: integer, format: int64, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ReceiveReturn:
      type: object
      additionalProperties: false
      required: [items, idempotency_key]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [return_item_id, received_quantity]
            properties:
              return_item_id: {type: string, format: uuid}
              received_quantity: {type: integer, format: int64, minimum: 0}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    InspectReturn:
      type: object
      additionalProperties: false
      required: [items, idempotency_key]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [return_item_id, disposition]
            properties:
              return_item_id: {type: string, format: uuid}
              disposition: {type: string, enum: [restockable, damaged, wrong_product, missing, rejected]}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    RestockReturn:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    CorrectReturnRestock:
      type: object
      additionalProperties: false
      required: [items, reason, idempotency_key]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [return_item_id, quantity]
            properties:
              return_item_id: {type: string, format: uuid}
              quantity: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    CloseLifecycle:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ConsignmentDepartmentCommand:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        status: {type: string, enum: [active, inactive], default: active}
    ConsignmentMembershipCommand:
      type: object
      additionalProperties: false
      required: [employee_ids]
      properties:
        employee_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
    CreateConsignment:
      type: object
      additionalProperties: false
      required: [order_reference, source_type, lines, idempotency_key]
      properties:
        order_reference: {type: string, minLength: 1, maxLength: 200}
        dealer_reference: {type: [string, "null"], minLength: 1, maxLength: 200}
        pouch_reference: {type: [string, "null"], minLength: 1, maxLength: 200}
        source_type: {type: string, enum: [manual, import]}
        source_reference: {type: [string, "null"], minLength: 1, maxLength: 500}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [product_id, department_id, required_quantity]
            properties:
              product_id: {type: string, format: uuid}
              department_id: {type: string, format: uuid}
              required_quantity: {type: integer, format: int64, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ConsignmentAction:
      type: object
      additionalProperties: false
      required: [expected_version, idempotency_key]
      properties:
        expected_version: {type: integer, minimum: 1}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ConsignmentTransition:
      type: object
      additionalProperties: false
      required: [target_status, expected_version, idempotency_key]
      properties:
        target_status: {type: string, enum: [picking, ready, packing, packed, completed]}
        expected_version: {type: integer, minimum: 1}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ConsignmentProgress:
      type: object
      additionalProperties: false
      required: [ready_quantity, packed_quantity, expected_version, idempotency_key]
      properties:
        ready_quantity: {type: integer, format: int64, minimum: 0}
        packed_quantity: {type: integer, format: int64, minimum: 0}
        expected_version: {type: integer, minimum: 1}
        notes: {type: [string, "null"], minLength: 1, maxLength: 2000}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
