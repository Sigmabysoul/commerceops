openapi: 3.1.0
info:
  title: CommerceOps API
  version: 0.10.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check application and required dependency health
      responses:
        "200":
          description: Application and PostgreSQL are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Start a verified company-scoped session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, company_id]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                company_id: {type: string, format: uuid}
      responses:
        "200": {description: Authenticated; the session cookie is set}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/auth/session:
    get:
      operationId: getSession
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Current authenticated principal}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/company:
    get:
      operationId: getCompany
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Company established by the session}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/employees:
    get:
      operationId: listEmployees
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant employee list}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createEmployee
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEmployee"}
      responses:
        "201": {description: Employee created}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/employees/{employee_id}:
    parameters:
      - {$ref: "#/components/parameters/EmployeeID"}
    patch:
      operationId: setEmployeeStatus
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Employee status changed}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/user-access:
    post:
      operationId: createUserAccess
      security: [{sessionCookie: []}]
      responses:
        "201": {description: User and company access created}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/user-access/{user_id}:
    parameters:
      - {$ref: "#/components/parameters/UserID"}
    patch:
      operationId: setUserAccessStatus
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Company access status changed}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/user-access/{user_id}/roles:
    parameters:
      - {$ref: "#/components/parameters/UserID"}
    put:
      operationId: setUserRoles
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Role assignments replaced}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/roles:
    get:
      operationId: listRoles
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant roles and permissions}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createRole
      security: [{sessionCookie: []}]
      responses:
        "201": {description: Role created}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/roles/{role_id}/permissions:
    parameters:
      - {$ref: "#/components/parameters/RoleID"}
    put:
      operationId: setRolePermissions
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Permission assignments replaced}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/permissions:
    get:
      operationId: listPermissions
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Permission definitions}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/module-entitlements:
    get:
      operationId: listModuleEntitlements
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant module entitlements}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/module-entitlements/{module_key}:
    parameters:
      - name: module_key
        in: path
        required: true
        schema: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
    put:
      operationId: setModuleEntitlement
      security: [{sessionCookie: []}]
      responses:
        "204": {description: Entitlement changed}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Recent tenant audit entries}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/marketplaces:
    get:
      operationId: listMarketplaces
      summary: List normalized marketplace reference keys
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Active marketplace references}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Search tenant products
      security: [{sessionCookie: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive]}}
      responses:
        "200": {description: Tenant-scoped product list}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createProduct
      summary: Create a canonical tenant product
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "201": {description: Product created}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/products/{product_id}:
    parameters:
      - {$ref: "#/components/parameters/ProductID"}
    get:
      operationId: getProduct
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant product}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateProduct
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "200": {description: Updated product}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/sku-mappings:
    get:
      operationId: listSkuMappings
      security: [{sessionCookie: []}]
      parameters:
        - {name: product_id, in: query, schema: {type: string, format: uuid}}
        - {name: marketplace, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive]}}
      responses:
        "200": {description: Tenant-scoped SKU mappings}
    post:
      operationId: createSkuMapping
      summary: Manually train an exact SKU mapping
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkuMappingInput"}
      responses:
        "201": {description: SKU mapping created}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/sku-mappings/{mapping_id}:
    parameters:
      - {$ref: "#/components/parameters/MappingID"}
    patch:
      operationId: updateSkuMapping
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkuMappingInput"}
      responses:
        "200": {description: Updated SKU mapping}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/sku-mappings/resolve:
    post:
      operationId: resolveSkuMapping
      summary: Resolve a deterministic exact marketplace SKU
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [marketplace_key, sku]
              properties:
                marketplace_key: {type: string}
                sku: {type: string}
      responses:
        "200":
          description: Resolved mapping/product or explicit unresolved result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkuResolution"}
  /api/v1/amazon/jobs:
    post:
      operationId: uploadAmazonJob
      summary: Upload an Amazon PDF for durable background normalization
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "202": {description: Amazon job queued, or existing source job returned}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/amazon/jobs/{job_id}:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAmazonJob
      summary: Read Amazon job, normalized records, items, and review errors
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant-scoped Amazon processing details}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      operationId: retryAmazonJob
      summary: Clear derived Amazon results and queue the source for reprocessing
      security: [{sessionCookie: []}]
      responses:
        "202": {description: Amazon job queued for retry}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/meesho/jobs:
    post:
      operationId: uploadMeeshoJob
      summary: Upload a Meesho PDF for durable background normalization
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "202": {description: Meesho job queued, or existing source job returned}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/meesho/jobs/{job_id}:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getMeeshoJob
      summary: Read Meesho job, normalized records, items, documents, and review errors
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant-scoped Meesho processing details}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      operationId: retryMeeshoJob
      summary: Clear derived Meesho results and queue the source for reprocessing
      security: [{sessionCookie: []}]
      responses:
        "202": {description: Meesho job queued for retry}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/batches:
    get:
      operationId: listBatches
      summary: List tenant operational batches
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant-scoped batch summaries}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createBatch
      summary: Create an idempotent draft batch from normalized marketplace orders
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateBatch"}
      responses:
        "201": {description: Batch created}
        "200": {description: Existing batch returned for an idempotent replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/batches/{batch_id}:
    parameters:
      - {$ref: "#/components/parameters/BatchID"}
    get:
      operationId: getBatch
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Batch detail, ordered members, and derived product totals}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/batches/{batch_id}/ready:
    parameters:
      - {$ref: "#/components/parameters/BatchID"}
    post:
      operationId: readyBatch
      summary: Move a fully resolved draft batch to ready
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Batch is ready}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/batches/{batch_id}/cancel:
    parameters:
      - {$ref: "#/components/parameters/BatchID"}
    post:
      operationId: cancelBatch
      summary: Cancel a draft batch
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Batch is cancelled}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/batch-eligible-orders:
    get:
      operationId: listBatchEligibleOrders
      summary: List processed marketplace orders not already assigned to a batch
      security: [{sessionCookie: []}]
      parameters:
        - {name: marketplace, in: query, required: true, schema: {type: string, enum: [flipkart, amazon]}}
      responses:
        "200": {description: Tenant-scoped eligible normalized orders}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/worker-assignment-rules:
    get:
      operationId: listWorkerAssignmentRules
      summary: List tenant worker assignment rules
      security: [{sessionCookie: []}]
      parameters:
        - {name: marketplace, in: query, required: true, schema: {type: string, enum: [flipkart, amazon]}}
      responses:
        "200": {description: Exact-product rules and required marketplace fallback}
        "403": {$ref: "#/components/responses/Error"}
    put:
      operationId: replaceWorkerAssignmentRules
      summary: Atomically replace tenant worker assignment rules
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceWorkerAssignmentRules"}
      responses:
        "200": {description: Replaced assignment rules}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/batches/{batch_id}/print-jobs:
    parameters:
      - {$ref: "#/components/parameters/BatchID"}
    post:
      operationId: generateBatchPrintJob
      summary: Generate storage-backed printable artifacts for a ready batch
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeneratePrintJob"}
      responses:
        "201": {description: Print artifacts generated}
        "200": {description: Existing print job returned for an idempotent replay}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    get:
      operationId: listBatchPrintJobs
      summary: List print and reprint history for a batch
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant-scoped print history with artifacts}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/print-jobs/{print_job_id}:
    parameters:
      - {$ref: "#/components/parameters/PrintJobID"}
    get:
      operationId: getPrintJob
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant print job and artifact metadata}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/print-jobs/{print_job_id}/reprints:
    parameters:
      - {$ref: "#/components/parameters/PrintJobID"}
    post:
      operationId: reprintPrintJob
      summary: Create an idempotent source-linked reprint with a reason
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReprintJob"}
      responses:
        "201": {description: Reprint generated}
        "200": {description: Existing reprint returned for an idempotent replay}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/print-artifacts/{artifact_id}:
    parameters:
      - {$ref: "#/components/parameters/ArtifactID"}
    get:
      operationId: downloadPrintArtifact
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Generated PDF artifact}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/inventory:
    get:
      operationId: listInventoryBalances
      summary: List tenant Product Master inventory balances
      security: [{sessionCookie: []}]
      responses:
        "200": {description: On-hand, reserved, and available balances}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/inventory/transactions:
    get:
      operationId: listInventoryTransactions
      summary: List immutable tenant inventory ledger entries
      security: [{sessionCookie: []}]
      parameters:
        - {name: product_id, in: query, schema: {type: string, format: uuid}}
        - {name: type, in: query, schema: {type: string, enum: [stock_in, manual_adjustment, correction, ecommerce_out]}}
      responses:
        "200": {description: Filtered inventory transactions}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/inventory/stock-in:
    post:
      operationId: inventoryStockIn
      summary: Record positive stock-in through the ledger
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InventoryCommand"}}}}
      responses:
        "201": {description: Stock-in recorded}
        "200": {description: Existing transaction returned for exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/inventory/adjustments:
    post:
      operationId: inventoryAdjustment
      summary: Record a reasoned nonzero manual inventory delta
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InventoryCommand"}}}}
      responses:
        "201": {description: Adjustment recorded}
        "200": {description: Existing transaction returned for exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/inventory/corrections:
    post:
      operationId: inventoryCorrection
      summary: Record a compensating correction without rewriting history
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InventoryCommand"}}}}
      responses:
        "201": {description: Correction recorded}
        "200": {description: Existing transaction returned for exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/inventory/batches/{batch_id}/confirm-outbound:
    parameters:
      - {$ref: "#/components/parameters/BatchID"}
    post:
      operationId: confirmInventoryEcommerceOutbound
      summary: Atomically deduct a ready batch's Product Master totals once
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdempotentCommand"}}}}
      responses:
        "201": {description: Ecommerce outbound transactions recorded}
        "200": {description: Existing transactions returned for exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/inventory/reservations:
    get:
      operationId: listInventoryReservations
      security: [{sessionCookie: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [active, released]}}
      responses:
        "200": {description: Tenant reservations}
    post:
      operationId: createInventoryReservation
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReservationCommand"}}}}
      responses:
        "201": {description: Stock reserved}
        "200": {description: Existing reservation returned for exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/inventory/reservations/{reservation_id}/release:
    parameters:
      - {name: reservation_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: releaseInventoryReservation
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReasonedIdempotentCommand"}}}}
      responses:
        "201": {description: Reservation released}
        "200": {description: Existing release returned for exact replay}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/cancellations:
    get:
      operationId: listCancellations
      summary: List tenant cancellation records
      security: [{sessionCookie: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [recorded, closed]}}
        - {name: marketplace, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,49}$'}}
      responses:
        "200": {description: Tenant cancellation records}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createCancellation
      summary: Idempotently record cancellation and its authoritative outbound snapshot
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateCancellation"}}}}
      responses:
        "201": {description: Cancellation recorded without changing inventory}
        "200": {description: Existing cancellation returned for exact replay}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/cancellations/{cancellation_id}:
    parameters:
      - {name: cancellation_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getCancellation
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant cancellation detail}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/cancellations/{cancellation_id}/close:
    parameters:
      - {name: cancellation_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: closeCancellation
      summary: Idempotently close a cancellation without changing inventory
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CloseLifecycle"}}}}
      responses:
        "201": {description: Cancellation closure recorded}
        "200": {description: Existing closure returned for exact replay}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/returns:
    get:
      operationId: listReturns
      summary: List tenant return cases
      security: [{sessionCookie: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [expected, received, inspected, inspection_pending, restocked, restock_corrected, damaged, rejected, closed]}}
        - {name: marketplace, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,49}$'}}
      responses:
        "200": {description: Tenant return-case summaries}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createReturn
      summary: Create an expected physical return from normalized order items
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateReturn"}}}}
      responses:
        "201": {description: Expected return created without changing inventory}
        "200": {description: Existing return returned for exact replay}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/returns/{return_id}:
    parameters:
      - {name: return_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getReturn
      summary: Read return items and append-only lifecycle events
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Tenant return detail}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/returns/{return_id}/receive:
    parameters:
      - {name: return_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: receiveReturn
      summary: Idempotently record explicit physical quantities received
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReceiveReturn"}}}}
      responses:
        "201": {description: Physical receipt recorded without changing inventory}
        "200": {description: Existing receipt returned for exact replay}
