      summary: Record an explicit disposition for every received return item
      security: [{sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InspectReturn"}}}}
      responses:
        "201": {description: Return dispositions recorded without changing inventory}
        "200": {description: Existing inspection returned for exact replay}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/returns/{return_id}/restock:
    parameters:
