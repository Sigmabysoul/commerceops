          enum:
          - scheduled
          - ecommerce_batch_ready
          - consignment_packing
          - consignment_packed
        schedule:
          $ref: '#/components/schemas/AutomationSchedule'
        asset_id:
          type: string
          format: uuid
        printer_id:
          type: string
          format: uuid
        copies:
          type: integer
          minimum: 1
          maximum: 100
        daily_limit:
          type:
